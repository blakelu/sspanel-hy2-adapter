# 复制到落地机 /etc/wireguard/wg-landing.conf，由 wg-quick 管理。
[Interface]
Address = 10.77.0.2/24
ListenPort = REPLACE_LANDING_PORT
PrivateKey = REPLACE_LANDING_PRIVATE_KEY
MTU = 1420

# REPLACE_PUBLIC_INTERFACE 必须替换为落地机默认公网网卡，例如 eth0 或 ens3。
# REPLACE_RELAY_PUBLIC_IP 必须替换为入口机公网 IP，仅允许它访问 WireGuard 端口。
PostUp = iptables -C INPUT -p udp -s REPLACE_RELAY_PUBLIC_IP --dport REPLACE_LANDING_PORT -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p udp -s REPLACE_RELAY_PUBLIC_IP --dport REPLACE_LANDING_PORT -j ACCEPT; iptables -C FORWARD -i %i -s 10.77.0.1/32 -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -i %i -s 10.77.0.1/32 -j ACCEPT; iptables -C FORWARD -o %i -d 10.77.0.1/32 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -o %i -d 10.77.0.1/32 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; iptables -t nat -C POSTROUTING -s 10.77.0.1/32 -o REPLACE_PUBLIC_INTERFACE -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.77.0.1/32 -o REPLACE_PUBLIC_INTERFACE -j MASQUERADE
PostDown = iptables -D INPUT -p udp -s REPLACE_RELAY_PUBLIC_IP --dport REPLACE_LANDING_PORT -j ACCEPT 2>/dev/null || true; iptables -D FORWARD -i %i -s 10.77.0.1/32 -j ACCEPT 2>/dev/null || true; iptables -D FORWARD -o %i -d 10.77.0.1/32 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true; iptables -t nat -D POSTROUTING -s 10.77.0.1/32 -o REPLACE_PUBLIC_INTERFACE -j MASQUERADE 2>/dev/null || true

[Peer]
PublicKey = REPLACE_RELAY_PUBLIC_KEY
PresharedKey = REPLACE_PRESHARED_KEY
AllowedIPs = 10.77.0.1/32
