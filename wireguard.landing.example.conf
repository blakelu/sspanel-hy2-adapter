# 复制到 wireguard-landing/wg_confs/wg-landing.conf。
[Interface]
Address = 10.77.0.2/24
ListenPort = 51820
PrivateKey = REPLACE_LANDING_PRIVATE_KEY

# REPLACE_PUBLIC_INTERFACE 必须替换为落地机默认公网网卡，例如 eth0 或 ens3。
PostUp = iptables -C FORWARD -i %i -s 10.77.0.1/32 -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -i %i -s 10.77.0.1/32 -j ACCEPT; iptables -C FORWARD -o %i -d 10.77.0.1/32 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || iptables -I FORWARD 1 -o %i -d 10.77.0.1/32 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; iptables -t nat -C POSTROUTING -s 10.77.0.1/32 -o REPLACE_PUBLIC_INTERFACE -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.77.0.1/32 -o REPLACE_PUBLIC_INTERFACE -j MASQUERADE
PostDown = iptables -D FORWARD -i %i -s 10.77.0.1/32 -j ACCEPT 2>/dev/null || true; iptables -D FORWARD -o %i -d 10.77.0.1/32 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true; iptables -t nat -D POSTROUTING -s 10.77.0.1/32 -o REPLACE_PUBLIC_INTERFACE -j MASQUERADE 2>/dev/null || true

[Peer]
PublicKey = REPLACE_RELAY_PUBLIC_KEY
PresharedKey = REPLACE_PRESHARED_KEY
AllowedIPs = 10.77.0.1/32
