# 复制为 config.docker-vless-reality.yaml。
server:
  listen: 0.0.0.0:8080
  auth_path: /auth
  auth_token: ${ADAPTER_AUTH_TOKEN}
  read_timeout: 5s
  write_timeout: 15s

panel:
  base_url: ${SSPANEL_BASE_URL}
  key: ${SSPANEL_MU_KEY}
  node_id: ${SSPANEL_NODE_ID}
  timeout: 5s
  heartbeat_interval: 60s
  insecure_skip_verify: false

user_source:
  # API 模式会使用 /mod_mu/users 返回的当前可用用户 UUID。
  mode: api
  credential_fields:
    - uuid
  api:
    refresh_interval: 30s
    max_stale: 5m
  database:
    dsn: ${SSPANEL_DB_USER}:${SSPANEL_DB_PASSWORD}@tcp(${SSPANEL_DB_HOST}:3306)/${SSPANEL_DB_NAME}?charset=utf8mb4&parseTime=true&loc=Local
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 5m

hy2:
  enabled: false

xray:
  enabled: true
  # Xray API 只能通过 Compose 内网访问，不要映射到公网。
  api_address: xray:10085
  inbound_tag: vless-reality
  timeout: 5s
  sync_interval: 30s
  poll_interval: 60s
  state_file: ./data/xray-traffic-state.json
  run_on_startup: true

log:
  level: info
