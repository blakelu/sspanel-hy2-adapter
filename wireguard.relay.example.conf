# 复制到 wireguard-relay/wg_confs/wg-relay.conf。
[Interface]
Address = 10.77.0.1/32
PrivateKey = REPLACE_RELAY_PRIVATE_KEY
Table = off

# 只路由源地址为 WireGuard 隧道地址的连接，避免改变入口机的默认路由。
PostUp = ip rule del from 10.77.0.1/32 table 51845 priority 10000 2>/dev/null || true; ip rule add from 10.77.0.1/32 table 51845 priority 10000; ip route replace default dev %i table 51845
PostDown = ip rule del from 10.77.0.1/32 table 51845 priority 10000 2>/dev/null || true; ip route flush table 51845

[Peer]
PublicKey = REPLACE_LANDING_PUBLIC_KEY
PresharedKey = REPLACE_PRESHARED_KEY
Endpoint = REPLACE_LANDING_DOMAIN:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
